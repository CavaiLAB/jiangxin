name: docs-site

# 文档站：PR 上构建并检查；合并到 main 后把构建产物发布到 docs-site 分支，部署环境从这个分支取站点内容。
# 站点只收本仓库的文档，构建不读别的仓库。见 website/README.md。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一个 PR 或同一个分支上，新的一次开始就取消旧的：发布出去的总是最新的主干
concurrency:
  group: docs-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      # 先装 Node 再装 pnpm：pnpm 的版本取自 website/package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json
      - name: pnpm 缓存目录
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('website/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 脚本单测
        run: pnpm test

      - name: 构建站点（含死链与失效锚点检查）
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: website/doc_build
          retention-days: 7

  publish:
    name: 发布
    needs: build
    # 只发布主干；手动触发也只在 main 上发布
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: ${{ runner.temp }}/docs-site

      - name: 推送到 docs-site 分支
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash website/scripts/publish.sh "$RUNNER_TEMP/docs-site"

      - name: 记录
        run: echo "站点已发布到 docs-site 分支。部署环境每 60 秒拉取一次，约一分钟后可见。" >> "$GITHUB_STEP_SUMMARY"
